repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        args: ['--maxkb=5120']
      - id: debug-statements

  - repo: local
    hooks:
      - name: Tests
        entry: python -m pytest tests/ -x -q
        language: system
        pass_filenames: false
        always_run: true
